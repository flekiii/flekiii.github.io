<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0a0a0a"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../style.css?v=20"><title>Changelog · flekiii</title></head>
<body data-site-page="changelog"><header class="project-nav"><a class="logo" href="../">flekiii<span>.</span></a><nav><a href="../#projects" data-project-i18n="projects">Projects</a><a href="../#overview" data-project-i18n="overview">Overview</a><a href="../#updates" data-project-i18n="updates">Updates</a><a href="../#support" data-project-i18n="support">Support</a></nav><div class="project-language"><button type="button" data-language="en" class="active">EN</button><button type="button" data-language="uk">UA</button></div></header>
<main class="project-page-v2 changelog-page"><a class="project-back" href="../#updates" data-project-i18n="back">← flekiii</a><section class="project-hero-card"><span class="project-eyebrow" data-project-i18n="projectLabel">SITE JOURNAL</span><h1 data-project-i18n="changelogTitle">Changelog<span>.</span></h1><p class="project-lead" data-project-i18n="changelogLead">A timeline of the site and ecosystem as it grows.</p><div class="project-meta-row"><span data-project-i18n="journalMeta">JOURNAL</span><span data-project-i18n="livingMeta">LIVING PAGE</span></div></section><section class="changelog-timeline" id="changelogTimeline"></section></main>
<footer class="project-footer"><span>flekiii.</span><span data-project-i18n="footer">Built independently.</span></footer><script src="../project-page.js?v=43"></script><script>
(() => {
  const renderEntry = ({ id, version, date, titleEn, titleUk, textEn, textUk }, timeline, uk) => {
    if (document.getElementById(id)) return;

    const entry = document.createElement("article");
    entry.className = "changelog-entry";
    entry.id = id;
    entry.innerHTML = `<div class="changelog-entry-mark"><span>${version}</span><i></i></div><div class="changelog-entry-card"><small>${date}</small><h2>${uk ? titleUk : titleEn}</h2><p>${uk ? textUk : textEn}</p></div>`;
    timeline.prepend(entry);
  };

  const renderChangelog = () => {
    const timeline = document.getElementById("changelogTimeline");

    if (!timeline) return;

    const uk = document.documentElement.lang === "uk";

    renderEntry({
      id: "fleki-convert-changelog",
      version: "v0.0.58",
      date: "OCTOBER 4, 2026",
      titleEn: "FLEKI CONVERT added to the site",
      titleUk: "FLEKI CONVERT додано на сайт",
      textEn: "FLEKI CONVERT was added to Projects and Downloads & Gallery. The downloads section now automatically shows official builds from the converter's latest release.",
      textUk: "FLEKI CONVERT додано до Projects і Downloads & Gallery. Секція завантажень тепер автоматично показує офіційні збірки з останнього релізу конвертера."
    }, timeline, uk);

    const visitorEntry = document.getElementById("visitor-counter-changelog");
    if (visitorEntry) return;

    const entry = document.createElement("article");
    entry.className = "changelog-entry";
    entry.id = "visitor-counter-changelog";
    entry.innerHTML = `<div class="changelog-entry-mark"><span>v0.0.57</span><i></i></div><div class="changelog-entry-card"><small>OCTOBER 2, 2026</small><h2>${uk ? "Лічильник відвідувачів додано" : "Visitor counter added"}</h2><p>${uk ? "Біля футера додано лічильник ProveSource, щоб сайт показував активність відвідувачів." : "A ProveSource visitor counter was added near the footer so the site can show visitor activity."}</p></div>`;
    timeline.prepend(entry);
  };

  document.addEventListener("DOMContentLoaded", () => {
    renderChangelog();
    new MutationObserver(renderChangelog).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["lang"]
    });
  });
})();
</script></body></html>
