<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0a0a0a"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../style.css?v=20"><title>Changelog · flekiii</title></head>
<body data-site-page="changelog"><header class="project-nav"><a class="logo" href="../">flekiii<span>.</span></a><nav><a href="../#projects" data-project-i18n="projects">Projects</a><a href="../#overview" data-project-i18n="overview">Overview</a><a href="../#updates" data-project-i18n="updates">Updates</a><a href="../#support" data-project-i18n="support">Support</a></nav><div class="project-language"><button type="button" data-language="en" class="active">EN</button><button type="button" data-language="uk">UA</button></div></header>
<main class="project-page-v2 changelog-page"><a class="project-back" href="../#updates" data-project-i18n="back">← flekiii</a><section class="project-hero-card"><span class="project-eyebrow" data-project-i18n="projectLabel">SITE JOURNAL</span><h1 data-project-i18n="changelogTitle">Changelog<span>.</span></h1><p class="project-lead" data-project-i18n="changelogLead">A timeline of the site and ecosystem as it grows.</p><div class="project-meta-row"><span data-project-i18n="journalMeta">JOURNAL</span><span data-project-i18n="livingMeta">LIVING PAGE</span></div></section><section class="changelog-timeline" id="changelogTimeline"></section></main>
<footer class="project-footer"><span>flekiii.</span><span data-project-i18n="footer">Built independently.</span></footer><script src="../project-page.js?v=44"></script><script>
(() => {
  const renderEntry = ({ id, version, date, titleEn, titleUk, textEn, textUk }, timeline, uk) => {
    if (document.getElementById(id)) return;

    const entry = document.createElement("article");
    entry.className = "changelog-entry";
    entry.id = id;
    entry.innerHTML = `<div class="changelog-entry-mark"><span>${version}</span><i></i></div><div class="changelog-entry-card"><small>${date}</small><h2>${uk ? titleUk : titleEn}</h2><p>${uk ? textUk : textEn}</p></div>`;
    timeline.append(entry);
  };

  const renderChangelog = () => {
    const timeline = document.getElementById("changelogTimeline");

    if (!timeline) return;

    const uk = document.documentElement.lang === "uk";
    renderEntry({
      id: "visitor-counter-changelog",
      version: "v0.0.57",
      date: "OCTOBER 2, 2026",
      titleEn: "Visitor counter added",
      titleUk: "Лічильник відвідувачів додано",
      textEn: "A ProveSource visitor counter was added near the footer so the site can show visitor activity.",
      textUk: "Біля футера додано лічильник ProveSource, щоб сайт показував активність відвідувачів."
    }, timeline, uk);

    renderEntry({
      id: "fleki-convert-changelog",
      version: "v0.0.58",
      date: "OCTOBER 4, 2026",
      titleEn: "FLEKI CONVERT added to the site",
      titleUk: "FLEKI CONVERT додано на сайт",
      textEn: "FLEKI CONVERT was added to Projects and Downloads & Gallery. The downloads section now automatically shows official builds from the converter's latest release.",
      textUk: "FLEKI CONVERT додано до Projects і Downloads & Gallery. Секція завантажень тепер автоматично показує офіційні збірки з останнього релізу конвертера."
    }, timeline, uk);

    renderEntry({
      id: "fleki-convert-navigation-changelog",
      version: "v0.0.59",
      date: "OCTOBER 4, 2026",
      titleEn: "FLEKI CONVERT downloads navigation refined",
      titleUk: "Навігацію завантажень FLEKI CONVERT допрацьовано",
      textEn: "FLEKI CONVERT now opens its own project page. Downloads & Gallery starts with project selection, and FLEKI CONVERT opens its package list in place with a Back button.",
      textUk: "FLEKI CONVERT тепер відкриває окрему сторінку проєкту. Downloads & Gallery починається з вибору проєкту, а FLEKI CONVERT відкриває список збірок на цьому ж місці з кнопкою «Назад»."
    }, timeline, uk);

    renderEntry({
      id: "downloads-general-changelog",
      version: "v0.0.60",
      date: "OCTOBER 4, 2026",
      titleEn: "Downloads section simplified",
      titleUk: "Секцію завантажень спрощено",
      textEn: "Downloads is now presented as the official download point for my projects. Projects can be opened in place, with their available builds shown inside the same section.",
      textUk: "Downloads тепер представлено як офіційне місце завантаження моїх проєктів. Проєкти відкриваються прямо в цій секції, а доступні збірки показуються там же."
    }, timeline, uk);

    renderEntry({
      id: "downloads-hosting-changelog",
      version: "v0.0.61",
      date: "OCTOBER 4, 2026",
      titleEn: "FLEKI CONVERT download hosting separated from source code",
      titleUk: "Завантаження FLEKI CONVERT відокремлено від коду",
      textEn: "FLEKI CONVERT downloads now use dedicated releases on the public website repository, keeping the application source repository separate from public binary distribution.",
      textUk: "Завантаження FLEKI CONVERT тепер використовують окремі релізи публічного репозиторію сайту, щоб код програми був відокремлений від публічної дистрибуції бінарних збірок."
    }, timeline, uk);

    renderEntry({
      id: "ready-download-filter-changelog",
      version: "v0.0.62",
      date: "OCTOBER 4, 2026",
      titleEn: "Ready to download project filter added",
      titleUk: "Додано фільтр готових до завантаження проєктів",
      textEn: "A new Ready to Download filter was added to Projects. FLEKI CONVERT appears there while remaining part of the Apps category.",
      textUk: "До Projects додано новий фільтр «Готові до завантаження». FLEKI CONVERT відображається там, але також залишається в категорії «Програми»."
    }, timeline, uk);

    renderEntry({
      id: "fleki-convert-card-fix-changelog",
      version: "v0.0.63",
      date: "OCTOBER 4, 2026",
      titleEn: "FLEKI CONVERT project card fixed",
      titleUk: "Картку FLEKI CONVERT виправлено",
      textEn: "The FLEKI CONVERT card now uses the same structure as the other project cards and correctly appears in All, Apps and Ready to Download filters.",
      textUk: "Картка FLEKI CONVERT тепер має таку саму структуру, як інші картки, і коректно відображається у фільтрах Усі, Програми та Готові до завантаження."
    }, timeline, uk);

    renderEntry({
      id: "ready-filter-logic-changelog",
      version: "v0.0.64",
      date: "OCTOBER 4, 2026",
      titleEn: "Ready to Download filter logic fixed",
      titleUk: "Логіку фільтра готових до завантаження виправлено",
      textEn: "FLEKI CONVERT now keeps its normal Apps category and uses a separate ready-to-download flag, so it appears correctly in All, Apps and Ready to Download.",
      textUk: "FLEKI CONVERT тепер зберігає звичайну категорію «Програми» та окрему ознаку готовності до завантаження, тому коректно відображається в Усі, Програми та Готові до завантаження."
    }, timeline, uk);

    renderEntry({
      id: "ready-filter-final-fix-changelog",
      version: "v0.0.65",
      date: "OCTOBER 4, 2026",
      titleEn: "Ready to Download filter matching fixed",
      titleUk: "Зіставлення фільтра «Готові до завантаження» виправлено",
      textEn: "The Ready to Download filter now uses an explicit project category marker, so FLEKI CONVERT is matched reliably while remaining in Apps.",
      textUk: "Фільтр «Готові до завантаження» тепер використовує окрему явну ознаку категорії, тому FLEKI CONVERT стабільно знаходиться в ньому та залишається в «Програмах»."
    }, timeline, uk);

    renderEntry({
      id: "duplicate-project-filter-removed-changelog",
      version: "v0.0.66",
      date: "OCTOBER 4, 2026",
      titleEn: "Duplicate project filter removed",
      titleUk: "Дубль фільтра проєктів прибрано",
      textEn: "A second legacy filter script was overriding the main project filter logic. It was removed so All, Apps and Ready to Download now use the same filter system.",
      textUk: "Другий старий скрипт фільтра перетирав основну логіку фільтрів. Його прибрано, тому Усі, Програми та Готові до завантаження тепер використовують одну систему фільтрації."
    }, timeline, uk);

    renderEntry({
      id: "mobile-cache-refresh-changelog",
      version: "v0.0.67",
      date: "OCTOBER 6, 2026",
      titleEn: "Mobile cache refresh added",
      titleUk: "Оновлення кешу для мобільної версії",
      textEn: "Site asset versions were refreshed so phones load the latest CSS and JavaScript changes instead of an older cached copy.",
      textUk: "Версії файлів сайту оновлено, щоб телефони завантажували актуальні CSS і JavaScript замість старої копії з кешу."
    }, timeline, uk);

    renderEntry({
      id: "project-modal-mobile-spacing-changelog",
      version: "v0.0.68",
      date: "OCTOBER 6, 2026",
      titleEn: "Mobile project section tightened",
      titleUk: "Мобільну секцію проєктів ущільнено",
      textEn: "Mobile project cards and project details received tighter spacing and sizing to fit more content on screen.",
      textUk: "Мобільні картки та деталі проєктів отримали компактніші відступи й розміри, щоб на екрані поміщалося більше контенту."
    }, timeline, uk);

    renderEntry({
      id: "project-modal-mobile-compact-changelog",
      version: "v0.0.69",
      date: "OCTOBER 6, 2026",
      titleEn: "Mobile project details compacted",
      titleUk: "Деталі проєктів на мобільному ущільнено",
      textEn: "Project detail windows on phones were made more compact so more information is visible with less scrolling.",
      textUk: "Детальні вікна проєктів на телефонах зроблено компактнішими, щоб більше інформації було видно з меншим гортанням."
    }, timeline, uk);

    renderEntry({
      id: "ultra-compact-project-modal-changelog",
      version: "v0.0.70",
      date: "OCTOBER 6, 2026",
      titleEn: "Ultra-compact project modal",
      titleUk: "Максимально компактне меню проєктів",
      textEn: "The mobile project detail window was tightened further: less padding, smaller typography, tighter line spacing and a compact project-page button so substantially more project information fits on screen.",
      textUk: "Мобільне детальне вікно проєкту додатково ущільнено: менші відступи, шрифти, міжрядковий інтервал і компактніша кнопка сторінки проєкту, щоб на екрані поміщалося значно більше інформації."
    }, timeline, uk);

    renderEntry({
      id: "changelog-order-and-phone-goal-changelog",
      version: "v0.0.71",
      date: "OCTOBER 6, 2026",
      titleEn: "Changelog order and phone goal simplified",
      titleUk: "Порядок Changelog і ціль на телефон спрощено",
      textEn: "The Challenge Log now keeps the newest changes above older ones, with v0.0.57 staying in its correct chronological position. The phone support goal was shortened to: iPhone 11 Pro Max or something newer. Versioning will continue through v0.0.100 and then move to v0.1.0.",
      textUk: "Challenge Log тепер показує нові зміни вище старих, а v0.0.57 займає правильне місце в хронології. Опис цілі на телефон скорочено до: iPhone 11 Pro Max або щось новіше. Версії продовжуються до v0.0.100, після чого буде v0.1.0."
    }, timeline, uk);

    renderEntry({
      id: "changelog-render-order-fixed",
      version: "v0.0.73",
      date: "OCTOBER 6, 2026",
      titleEn: "Changelog rendering order fixed",
      titleUk: "Порядок відображення Changelog виправлено",
      textEn: "The Challenge Log now stores entries from newest to oldest and renders them in that same order without reversing the list, so the newest version always stays at the top.",
      textUk: "Challenge Log тепер зберігає записи від новішого до старішого та показує їх у тому самому порядку без перевертання списку, тому найновіша версія завжди залишається зверху."
    }, timeline, uk);

    renderEntry({
      id: "visitor-counter-unique-changelog",
      version: "v0.0.72",
      date: "OCTOBER 6, 2026",
      titleEn: "Visitor counter switched to unique visitors",
      titleUk: "Лічильник перемкнено на унікальних відвідувачів",
      textEn: "The visitor counter now uses ProveSource's unique visitor mode instead of total page views, so refreshing the site does not add another visitor.",
      textUk: "Лічильник відвідувачів тепер використовує режим унікальних відвідувачів ProveSource замість загальної кількості переглядів, тому повторне оновлення сторінки не додає нового відвідувача."
    }, timeline, uk);

  };

  document.addEventListener("DOMContentLoaded", () => {
    renderChangelog();
    new MutationObserver(renderChangelog).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["lang"]
    });
  });
})();
</script></body></html>
