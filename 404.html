<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>404 · flekiii</title>
  <link rel="stylesheet" href="style.css?v=20">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:30px}
    .error-card{width:min(720px,100%);padding:64px 54px;border:1px solid rgba(255,111,174,.2);border-radius:28px;background:radial-gradient(circle at 78% 18%,rgba(255,111,174,.1),transparent 34%),linear-gradient(145deg,var(--surface-2),var(--surface));text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.35)}
    .error-number{color:var(--pink);font-size:clamp(74px,16vw,150px);line-height:.85;font-weight:900;letter-spacing:-.09em}
    .error-card h1{margin-top:28px;font-size:clamp(30px,6vw,54px);letter-spacing:-.06em}
    .error-card p{max-width:500px;margin:16px auto 0;color:var(--muted);line-height:1.7;font-size:15px}
    .error-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
    .error-mark{display:inline-flex;align-items:center;gap:7px;margin-top:22px;color:#666;font-size:9px;font-weight:800;letter-spacing:.14em}
    .error-mark i{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px rgba(255,111,174,.8)}
    @media(max-width:600px){.error-card{padding:48px 24px}.error-number{font-size:92px}}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <div class="error-number">404</div>
      <h1>Page not found.</h1>
      <p>The page you're looking for doesn't exist, moved, or was never published.</p>
      <div class="error-actions">
        <a class="button primary" href="./">GO HOME</a>
        <a class="button secondary" href="./#projects">VIEW PROJECTS</a>
      </div>
      <div class="error-mark"><i></i>FLEKIII · INDEPENDENT DEVELOPER</div>
    </section>
  </main>
</body>
</html>
