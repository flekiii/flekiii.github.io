name: Fleki's Wrld marketplace live smoke
on:
  push:
    branches: [main]
    paths:
      - 'backend/marketplace.js'
      - 'backend/market-catalog.js'
      - 'backend/worker.js'
      - 'backend/migrations/**'
      - 'wrld-market.js'
      - '.github/workflows/marketplace-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run marketplace syntax and security tests
        run: |
          node --check backend/marketplace.js
          node --check backend/market-catalog.js
          node --check wrld-market.js
          node --test backend/marketplace.test.mjs
          node --test tests/wrld-ui.test.mjs
      - name: Confirm production catalog and 2FA gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const url="https://flekis-wrld-api.flekideveloper.workers.dev";
          const call=(p,opts={})=>fetch(url+p,{...opts,signal:AbortSignal.timeout(15000),headers:{"Accept":"application/json",...(opts.headers||{})}});
          for(const path of ["/market/options?country=UA&category=furniture","/market/listings","/market/mine","/market/wishlist","/market/conversations"]){
            const res=await call(path);
            assert.equal(res.status,401,"Unauthenticated visitors must not see "+path);
          }
          const publicChat=await call("/messages/public");
          assert.equal(publicChat.status,200,"Global chat must be readable to visitors");
          const feed=await publicChat.json();
          assert.ok(Array.isArray(feed.messages));
          const post=await call("/market/listings",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
          assert.equal(post.status,401,"Publishing must require login and verified 2FA");
          const dm=await call("/market/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
          assert.equal(dm.status,401,"Marketplace messaging must require verified 2FA");
          console.log("Production marketplace private until 2FA; global community readable to guests.");
          NODE
