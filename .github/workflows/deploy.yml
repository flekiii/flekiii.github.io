name: Deploy Portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate files
        run: |
          node --check app.js
          node --check jar3d.js
          node --check earth3d.js
          node --check tether.js
          test -s earth3d.js
          test -s tether.js
          test -s index.html
          test -s jar3d.js
          test -s styles.css
          test -s favicon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
