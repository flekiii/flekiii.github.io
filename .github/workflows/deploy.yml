name: Deploy Portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate files
        run: |
          node --check app.js
          node --check backend/worker.js
          node --check backend/marketplace.js
          node --check backend/market-catalog.js
          node --check wrld-market.js
          node --check wrld-games.js
          node --check wrld-web-games.js
          node --check wrld-web-games-core.mjs
          node --test tests/web-games.test.mjs
          test -s wrld-web-games.css
          node --test backend/totp.test.mjs backend/marketplace.test.mjs
          node --test tests/wrld-ui.test.mjs
          node --check backend/houses.js
          node --check wrld-house-creator.mjs
          node --check wrld-home.mjs
          node --check wrld-home-core.mjs
          node --test tests/home-house.test.mjs
          node --test tests/house-interaction.test.mjs
          test -s wrld-home-creator.css
          test -s wrld-home.css
          node --check backend/oauth.js
          node --check wrld-social.js
          node --check jar3d.js
          node --check earth3d.js
          node --check tether.js
          test -s earth3d.js
          test -s tether.js
          test -s index.html
          test -s jar3d.js
          test -s styles.css
          test -s favicon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
