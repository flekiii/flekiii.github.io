name: Deploy Portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate files
        run: |
          node --check app.js
          node --check backend/worker.js
          node --check backend/world.js
          node --check backend/market-media.js
          node --check backend/showcase.js
          node --check backend/arcade.js
          node --check wrld-showcase.mjs
          node --check wrld-web-games.js
          node --test tests/site-upgrade.test.mjs
          node --check backend/discover.js
          node --check backend/game-catalog.js
          node --check wrld-discover.mjs
          node --check wrld-game-picker.js
          node --test tests/discovery-quests.test.mjs
          node --check backend/world-gallery.js
          node --check backend/world-feed.js
          node --check backend/world-clubs.js
          node --check backend/world-discuss.js
          node --check wrld-world.mjs
          node --check wrld-world-social.mjs
          node --test tests/world.test.mjs
          node --test tests/world-quest-cors.test.mjs
          node --test tests/world-progress-language.test.mjs
          node --test tests/language-menu.test.mjs
          node --test tests/about-layout.test.mjs
          test -s wrld-world.css
          node --check backend/profiles.js
          node --check wrld-profile.js
          node --test tests/profile-banner.test.mjs
          node --test tests/profile-media-size.test.mjs
          node --test tests/profile-studio.test.mjs
          node --test tests/profile-loading.test.mjs
          test -s wrld-profile.css
          test -s vendor/qrcode.js
          node --check backend/marketplace.js
          node --check backend/market-catalog.js
          node --check wrld-market.js
          node --check wrld-games.js
          node --check wrld-web-games.js
          node --check wrld-web-games-core.mjs
          node --test tests/web-games.test.mjs
          test -s wrld-web-games.css
          node --test backend/totp.test.mjs backend/marketplace.test.mjs
          node --test tests/wrld-ui.test.mjs
          node --check backend/oauth.js
          node --check wrld-social.js
          node --test tests/local-auth.test.mjs
          node --test tests/notifications-layout.test.mjs
          test -s wrld-notifications.css
          node --check jar3d.js
          node --check earth3d.js
          node --check tether.js
          test -s earth3d.js
          test -s tether.js
          test -s index.html
          test -s jar3d.js
          test -s styles.css
          test -s favicon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4

  api-smoke:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check public World API and browser CORS
        shell: bash
        run: |
          set -euo pipefail
          url="https://flekis-wrld-api.flekideveloper.workers.dev"
          origin="https://flekiii.github.io"
          check_get() {
            local path="$1" expected="$2" code
            local headers body
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS --retry 2 --retry-all-errors --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' -H "Origin: $origin" "$url$path")"
            test "$code" = "$expected" || { echo "::error::$path returned HTTP $code (expected $expected)"; exit 1; }
            grep -iq "^access-control-allow-origin: $origin" "$headers" || { echo "::error::$path is missing CORS"; exit 1; }
            jq -e . "$body" >/dev/null || { echo "::error::$path did not return JSON"; exit 1; }
            echo "$path: HTTP $code with CORS and JSON"
          }
          check_get "/world/quests" 401
          check_get "/world/ranking" 200
          headers="$(mktemp)"
          code="$(curl -sS --retry 2 --retry-all-errors --max-time 20 -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS -H "Origin: $origin" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization" "$url/world/quests")"
          test "$code" = "204" || { echo "::error::Quest preflight returned HTTP $code"; exit 1; }
          grep -iq "^access-control-allow-origin: $origin" "$headers" || { echo "::error::Quest preflight is missing CORS"; exit 1; }
          grep -iq "^access-control-allow-headers:.*Authorization" "$headers" || { echo "::error::Quest preflight does not allow Authorization"; exit 1; }
          echo "Quest preflight: HTTP 204 with CORS"
